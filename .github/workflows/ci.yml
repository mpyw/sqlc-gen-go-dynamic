name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      # Installs the pinned toolchain from mise.toml, then runs the gate: fmt, build, vet,
      # test -race. Lint is its own step so an upstream file failing it is legible as that.
      - run: mise run check
      - run: mise run lint
      # Coverage: one holistic profile for the module (coverage.out).
      - run: mise run cover
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false

  # The claim the design rests on is that real sqlc's output is enough, so the loop is run
  # against real sqlc: generate from a schema and a template, then compile the result.
  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run sqlc

  # Both transports have to build: the process one is what a local project uses, and the WASM
  # one is what a shared configuration points at.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: mise run wasm
